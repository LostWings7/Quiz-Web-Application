{% for result in results %}
<!-- Delete Modal -->
<div id="deleteModal-{{ result.id }}" class="modal-overlay">
    <div class="glass-modal">
        <div class="modal-icon warning"><i class="fa-solid fa-triangle-exclamation"></i></div>
        <h2>Delete Attempt</h2>
        <p>Are you sure you want to delete this attempt by {{ result.user.username }} for "{{ result.quiz.title }}"?</p>
        <form method="post" action="{% url 'dashboard_result_delete' result.id %}">
            {% csrf_token %}
            <div class="modal-actions">
                <button type="button" class="modal-btn secondary" onclick="hideModal('deleteModal-{{ result.id }}')">Cancel</button>
                <button type="submit" class="modal-btn primary">Delete</button>
            </div>
        </form>
    </div>
</div>
{% endfor %}
