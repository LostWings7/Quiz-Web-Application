{% for result in results %}
<!-- Delete Modal -->
<div id="deleteModal-{{ result.id }}" class="modal-overlay">
    <div class="glass-modal">
        <div class="modal-icon danger"><i class="fa-solid fa-triangle-exclamation"></i></div>
        <h2>Delete Attempt</h2>
        <p>Are you sure you want to permanently delete the attempt by <strong>{{ result.user.username }}</strong> for "<strong>{{ result.quiz.title }}</strong>"?</p>
        <form method="post" action="{% url 'dashboard_result_delete' result.id %}">
            {% csrf_token %}
            <div class="modal-actions">
                <button type="button" class="modal-btn secondary" onclick="hideModal('deleteModal-{{ result.id }}')">Cancel</button>
                <button type="submit" class="modal-btn primary" style="background-color: var(--error); border-color: var(--error);">Delete</button>
            </div>
        </form>
    </div>
</div>
{% endfor %}
